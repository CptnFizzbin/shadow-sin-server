services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shadowsin;Username=shadowsin;Password=changeme
      - Jwt__Secret=CHANGE_THIS_SECRET_KEY_MUST_BE_AT_LEAST_32_CHARS
      - Jwt__Issuer=ShadowSinServer
      - Jwt__Audience=ShadowSinServer
      - Jwt__ExpirationMinutes=60
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadowsin
      POSTGRES_USER: shadowsin
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowsin -d shadowsin"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
