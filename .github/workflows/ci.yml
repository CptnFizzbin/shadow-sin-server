name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ShadowSinServer.slnx

      - name: Build
        run: dotnet build ShadowSinServer.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ShadowSinServer.slnx --no-build -c Release --verbosity normal
